<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | MediVision AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-guest="1">
<div id="nav"></div>
<main class="wrap" id="app">

<div class="card authbox"><h1 style="font-size:1.8rem">Log in</h1>
<form id="form" novalidate>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="btn" type="submit">Log in</button><p class="msg" role="alert"></p>
</form>
<p class="hint">New here? <a href="signup.html">Create a free account</a></p></div>
</main>
<script src="js/app.js"></script>
</body>
</html>
