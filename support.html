<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support | MediVision AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="support" data-auth="1">
<div id="nav"></div>
<main class="wrap" id="app">

<h1>Support</h1>
<div class="card"><form id="form">
<label for="subject">Subject</label><input id="subject" name="subject" required>
<label for="message">How can we help?</label><textarea id="message" name="message" required></textarea>
<button class="btn" type="submit">Send request</button><p class="msg" role="status"></p></form></div>
<h2>Your requests</h2><div id="sent"></div>
</main>
<script src="js/app.js"></script>
</body>
</html>
