<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics | MediVision AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="analytics" data-auth="1">
<div id="nav"></div>
<main class="wrap" id="app">

<h1>Analytics</h1>
<p id="empty" class="empty" hidden>No data yet. Charts appear after your first scan.</p>
<div class="grid cols">
<div class="card"><h2>Scans per day</h2><div class="chartbox"><canvas id="c-day"></canvas></div></div>
<div class="card"><h2>Normal and abnormal</h2><div class="chartbox"><canvas id="c-split"></canvas></div></div>
<div class="card"><h2>Scans by type</h2><div class="chartbox"><canvas id="c-mod"></canvas></div></div>
<div class="card"><h2>Confidence spread</h2><div class="chartbox"><canvas id="c-conf"></canvas></div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="js/app.js"></script>
</body>
</html>
