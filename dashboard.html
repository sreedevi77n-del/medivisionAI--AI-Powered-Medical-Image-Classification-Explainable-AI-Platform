<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | MediVision AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" data-auth="1">
<div id="nav"></div>
<main class="wrap" id="app">

<h1>Dashboard</h1>
<div class="stats" id="stats"></div>
<div class="grid cols">

  <div class="card"><h2>Recent scans</h2><div id="recent"></div><div class="actions"><a class="btn" href="upload.html">Upload an image</a><a class="btn alt" href="history.html">View all</a></div></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

</body>
</html>
