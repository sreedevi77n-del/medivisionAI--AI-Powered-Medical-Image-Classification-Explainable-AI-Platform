<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account | MediVision AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="signup" data-guest="1">
<div id="nav"></div>
<main class="wrap" id="app">

<div class="card authbox"><h1 style="font-size:1.8rem">Create your account</h1>
<form id="form" novalidate>
<label for="name">Name</label><input id="name" name="name" autocomplete="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
<label for="password">Password (8 characters or more)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
<button class="btn" type="submit">Create account</button><p class="msg" role="alert"></p>
</form>
<p class="hint">Already have an account? <a href="login.html">Log in</a></p></div>
</main>
<script src="js/app.js"></script>
</body>
</html>
